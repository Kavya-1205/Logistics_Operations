services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: ups-logistics-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. Frontend Service (Next.js)
  - type: web
    name: ups-logistics-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ups-logistics-backend
          property: host
        value: https://ups-logistics-backend.onrender.com/api
